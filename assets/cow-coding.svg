<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.tapL{animation:tap .3s ease-in-out infinite}
.tapR{animation:tap .3s ease-in-out infinite .15s}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ln{transform-box:fill-box;transform-origin:left center;animation:type 5s infinite}
@keyframes type{0%{transform:scaleX(0)}12%,80%{transform:scaleX(1)}92%,100%{transform:scaleX(0)}}
.cur{animation:cur .6s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.bob{animation:bob .6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
</style>
<rect width="400" height="200" rx="14" fill="#F5E6CA"/>
<rect x="0" y="176" width="400" height="24" fill="#E3CDA4"/>
<!-- cow -->
<g class="bob">
<rect x="125" y="40" width="10" height="12" fill="#D9B98A"/>
<rect x="185" y="40" width="10" height="12" fill="#D9B98A"/>
<rect x="100" y="60" width="20" height="16" fill="#E8B4A0"/>
<rect x="200" y="60" width="20" height="16" fill="#E8B4A0"/>
<rect x="120" y="50" width="80" height="60" fill="#FFFFFF"/>
<rect x="120" y="50" width="30" height="20" fill="#5B4636"/>
<rect x="110" y="110" width="100" height="56" fill="#FFFFFF"/>
<rect x="120" y="120" width="30" height="20" fill="#5B4636"/>
<rect x="180" y="132" width="20" height="20" fill="#5B4636"/>
<rect class="eye" x="135" y="72" width="10" height="10" fill="#2B2118"/>
<rect class="eye" x="175" y="72" width="10" height="10" fill="#2B2118"/>
<rect x="140" y="92" width="40" height="18" fill="#F0B8B0"/>
<rect x="150" y="98" width="5" height="5" fill="#8B5E3C"/>
<rect x="165" y="98" width="5" height="5" fill="#8B5E3C"/>
</g>
<!-- keyboard -->
<rect x="90" y="164" width="140" height="14" rx="2" fill="#8B7355"/>
<g fill="#C9AE85"><rect x="96" y="168" width="10" height="4"/><rect x="110" y="168" width="10" height="4"/><rect x="124" y="168" width="10" height="4"/><rect x="138" y="168" width="10" height="4"/><rect x="152" y="168" width="10" height="4"/><rect x="166" y="168" width="10" height="4"/><rect x="180" y="168" width="10" height="4"/><rect x="194" y="168" width="10" height="4"/><rect x="208" y="168" width="14" height="4"/></g>
<rect class="tapL" x="132" y="152" width="22" height="14" fill="#3B2F2F"/>
<rect class="tapR" x="168" y="152" width="22" height="14" fill="#3B2F2F"/>
<!-- monitor -->
<rect x="250" y="30" width="136" height="100" rx="4" fill="#5B4636"/>
<rect x="256" y="36" width="124" height="88" fill="#2B2118"/>
<rect class="ln" x="264" y="46" width="50" height="6" fill="#E8C39E"/>
<rect class="ln" style="animation-delay:.5s" x="274" y="58" width="80" height="6" fill="#A8D5A2"/>
<rect class="ln" style="animation-delay:1s" x="274" y="70" width="60" height="6" fill="#F2A9A0"/>
<rect class="ln" style="animation-delay:1.5s" x="274" y="82" width="90" height="6" fill="#9CC5E8"/>
<rect class="ln" style="animation-delay:2s" x="264" y="94" width="30" height="6" fill="#E8C39E"/>
<rect class="cur" x="300" y="106" width="6" height="8" fill="#F5E6CA"/>
<rect x="308" y="130" width="20" height="14" fill="#5B4636"/>
<rect x="288" y="144" width="60" height="6" fill="#8B7355"/>
</svg>
